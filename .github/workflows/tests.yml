# Runs the tests (tests/) on every push and pull request: name parsing, statistics, registration and
# the image metrics on synthetic fiber networks with known alignment. Takes about 2 minutes.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages (analysis engine only, no window)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.23" "scipy>=1.9" "scikit-image>=0.20" "pandas>=1.5" "matplotlib>=3.8" \
                      "openpyxl>=3.1" "nd2>=0.10" "tifffile>=2023.1" "scikit-learn>=1.2" "joblib>=1.2" pytest
      - name: Run tests
        run: python -m pytest -q tests

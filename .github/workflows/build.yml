# Builds the standalone app for Mac (Apple Silicon + Intel) and Windows on GitHub's computers.
# This file must be at  .github/workflows/build.yml  at the TOP of the repository.
# The app files (CollagenAnalyzer.spec, requirements.txt, ...) may be at the top or in any sub-folder.
# Start: repository -> Actions -> "Build app" -> Run workflow.  Download: finished run -> Artifacts.
name: Build app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            name: mac-apple-silicon
          - os: macos-15-intel      # Intel Macs (if GitHub no longer offers this computer, only this job fails)
            name: mac-intel
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'mac-intel' }}
    steps:
      - uses: actions/checkout@v5
      - name: Find the app folder
        shell: bash
        run: |
          SPEC=$(find . -name CollagenAnalyzer.spec -not -path "*/.git/*" | head -1)
          if [ -z "$SPEC" ]; then echo "CollagenAnalyzer.spec not found - upload all app files"; exit 1; fi
          echo "APPDIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"
          echo "App folder: $(dirname "$SPEC")"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        working-directory: ${{ env.APPDIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        working-directory: ${{ env.APPDIR }}
        run: pyinstaller CollagenAnalyzer.spec --noconfirm
      - name: Quick test of the packaged app
        working-directory: ${{ env.APPDIR }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE="dist/Collagen Analyzer.app/Contents/MacOS/CollagenAnalyzer";
          else EXE="dist/CollagenAnalyzer/CollagenAnalyzer.exe"; fi
          "$EXE" --core --help | head -5
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        working-directory: ${{ env.APPDIR }}
        run: |
          cd dist && ditto -c -k --sequesterRsrc --keepParent "Collagen Analyzer.app" "$GITHUB_WORKSPACE/CollagenAnalyzer-${{ matrix.name }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          Copy-Item docs/User_Manual.pdf dist/CollagenAnalyzer/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/CollagenAnalyzer -DestinationPath "$env:GITHUB_WORKSPACE/CollagenAnalyzer-windows.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: CollagenAnalyzer-${{ matrix.name }}
          path: CollagenAnalyzer-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Collagen Analyzer ${{ github.ref_name }}
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
          files: CollagenAnalyzer-${{ matrix.name }}.zip
